name: beangle_app
description: "A new Flutter project."
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
    sdk: ^3.11.1

dependencies:
    flutter:
        sdk: flutter

    # 기본 아이콘
    cupertino_icons: ^1.0.8

    # 상태관리 / 라우팅
    get: ^4.7.3
    get_storage: ^2.1.1

    # API 통신
    http: ^1.6.0

    # 위치 / 지도
    geocoding: ^4.0.0
    geolocator: ^14.0.2
    flutter_map: ^8.2.2
    latlong2: ^0.9.1

    # Firebase
    firebase_core: ^4.5.0
    firebase_auth: ^6.2.0
    firebase_storage: ^13.1.0
    cloud_firestore: ^6.1.3
    firebase_messaging: ^16.1.2

    # Google 로그인
    google_sign_in: ^7.2.0
    google_sign_in_web: ^1.1.3

    # 알림
    flutter_local_notifications: ^21.0.0

    # 반응형 / 시각화
    responsive_framework: ^1.5.1
    fl_chart: ^1.0.0

    # 앱 리소스 생성
    flutter_native_splash: ^2.4.7

    # 보류
    # google_maps_flutter: ^2.16.0
    # table_calendar: ^3.2.0

dev_dependencies:
    flutter_test:
        sdk: flutter

    # 코드 스타일 / 정적 분석
    flutter_lints: ^6.0.0

    # 앱 아이콘 생성
    flutter_launcher_icons: ^0.14.4

# 앱 아이콘 설정
flutter_launcher_icons:
    android: true
    ios: true
    image_path: "images/beangle_logo.png"

    adaptive_icon_foreground: "images/beangle_logo.png"
    adaptive_icon_background: "#FFFFFF"
    min_sdk_android: 21

flutter:
    # Material Icons 사용
    uses-material-design: true

    # 정적 리소스
    assets:
        - images/
        - assets/data/station_hourly_predictions.json
